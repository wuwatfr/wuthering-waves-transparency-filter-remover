[General]
; Remove transparency filter is enabled by default. Change it in the WuwaTFR overlay; the
; selected value is saved here automatically.
EnableTFR=1

; Developer build only. Production ignores these settings.
; Keep disabled unless you are intentionally collecting diagnostics.
Dump=0
; Must be an absolute path when Dump=1. Environment variables are expanded.
DumpPath=%LOCALAPPDATA%\WuwaTFR\dump
