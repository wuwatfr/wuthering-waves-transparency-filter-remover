name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: windows-2025

    steps:
      - name: Check out a clean tree
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Configure, test, build, and package
        shell: pwsh
        run: ./build_windows.ps1
